services:
  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
    volumes:
      - ticketing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 5s
      timeout: 3s
      retries: 5

  harness:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ticketing:ticketing@db:5432/ticketing
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import urlopen; import sys;
          sys.exit(0 if urlopen('http://127.0.0.1:8000/health').status == 200 else 1)
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  notification-worker:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://ticketing:ticketing@db:5432/ticketing
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uv", "run", "--no-sync", "python", "-m", "incident_investigation_harness.notification_worker"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  incident-mcp:
    build:
      context: .
    ports:
      - "8001:8001"
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "python",
        "-m",
        "incident_investigation_harness.mcp.incident_mcp"
      ]

  operations-mcp:
    build:
      context: .
    ports:
      - "8002:8002"
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "python",
        "-m",
        "incident_investigation_harness.mcp.operations_mcp"
      ]

  knowledge-mcp:
    build:
      context: .
    ports:
      - "8003:8003"
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "python",
        "-m",
        "incident_investigation_harness.mcp.knowledge_mcp"
      ]

  source-mcp:
    build:
      context: .
    ports:
      - "8004:8004"
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "python",
        "-m",
        "incident_investigation_harness.mcp.source_mcp"
      ]

volumes:
  ticketing-data:
