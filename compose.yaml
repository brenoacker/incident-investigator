services:
  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
    volumes:
      - ticketing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 5s
      timeout: 3s
      retries: 5

  harness:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ticketing:ticketing@db:5432/ticketing
      REDIS_URL: redis://redis:6379/0
      OTEL_SERVICE_NAME: harness
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import urlopen; import sys;
          sys.exit(0 if urlopen('http://127.0.0.1:8000/health').status == 200 else 1)
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  notification-worker:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://ticketing:ticketing@db:5432/ticketing
      REDIS_URL: redis://redis:6379/0
      OTEL_SERVICE_NAME: notification-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    command: ["uv", "run", "--no-sync", "python", "-m", "incident_investigation_harness.notification_worker"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  incident-mcp:
    build:
      context: .
    ports:
      - "8001:8001"
    environment:
      OTEL_SERVICE_NAME: incident-mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "python",
        "-m",
        "incident_investigation_harness.mcp.incident_mcp"
      ]

  operations-mcp:
    build:
      context: .
    ports:
      - "8002:8002"
    environment:
      OTEL_SERVICE_NAME: operations-mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "python",
        "-m",
        "incident_investigation_harness.mcp.operations_mcp"
      ]

  knowledge-mcp:
    build:
      context: .
    ports:
      - "8003:8003"
    environment:
      OTEL_SERVICE_NAME: knowledge-mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "python",
        "-m",
        "incident_investigation_harness.mcp.knowledge_mcp"
      ]

  source-mcp:
    build:
      context: .
    ports:
      - "8004:8004"
    environment:
      OTEL_SERVICE_NAME: source-mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "python",
        "-m",
        "incident_investigation_harness.mcp.source_mcp"
      ]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:13133/"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.68
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4319:4317"

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      harness:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  ticketing-data:
