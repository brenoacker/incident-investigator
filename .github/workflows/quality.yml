name: Quality

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # source-mcp builds a deterministic diff from HEAD^ to HEAD.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests with coverage gate
        run: uv run python -m pytest tests/unit tests/contract tests/integration
      - name: Run type checker
        run: uv run mypy
