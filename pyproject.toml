[project]
name = "incident-investigation-harness"
version = "0.1.0"
description = "Local, reproducible harness for incident investigation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src"]
strict = true

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"
