[project]
name = "incident-investigation-harness"
version = "0.1.0"
description = "Local, reproducible harness for incident investigation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "email-validator>=2.2,<3.0",
    "mcp[cli]>=1.27,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=5.2,<6.0",
    "uvicorn[standard]>=0.34,<1.0",
    "opentelemetry-api>=1.29,<2.0",
    "opentelemetry-sdk>=1.29,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29,<2.0",
    "opentelemetry-exporter-prometheus>=0.50b0,<1.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=7.0,<8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract", "tests/integration"]
addopts = [
    "--cov=src/incident_investigation_harness",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
markers = [
    "integration: requires external services such as PostgreSQL",
    "eval: invokes Codex and may consume model tokens",
]

[tool.mypy]
files = ["src"]
strict = true

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"
